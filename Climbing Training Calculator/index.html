<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles.css">

    <title>Training Volume Calculator</title>
</head>
<body>

    <div id="formView">
        <form id="trainingCalculator" autocomplete="off">

            
            <header>
                <h2>Training Volume Calculator</h2>
                <h4>Determine your weekly training volume.</h4>
            </header>


            <!-- Strength and Power Category -->
            <fieldset class="physiologicalCategory" id="strengthAndPower">
                <legend>Strength and Power</legend>


                <!-- Fingers -->
                <div class="subCategory">
                    <h5>Fingers</h5>

                    <label for="fingersOffWallPercentage">What percentage of your training volume should be off‑the‑wall?</label>
                    <select id="fingersOffWallPercentage" >
                        <option value="0">0%</option>
                        <option value="20">20%</option>
                        <option value="40">40%</option>
                        <option value="60">60%</option>
                        <option value ="80">80%</option>
                        <option value="100">100%</option>
                    </select>

                    <label for="fingersRate">Target Improvement Rate:</label>
                    <select id="fingersRate" >
                            <option value="maintain">Maintain</option>
                            <option value="slow">Slow</option>
                            <option value="fast">Fast</option>
                    </select>
                </div>

                
                <!-- Upper Body Pull = UBP -->
                <div class="subCategory">
                    <h5>Upper Body Pull</h5>

                    <label for="ubpOffWallPercentage">What percentage of your training volume should be off‑the‑wall?</label>
                    <select id="ubpOffWallPercentage" >
                        <option value="0">0%</option>
                        <option value="20">20%</option>
                        <option value="40">40%</option>
                        <option value="60">60%</option>
                        <option value ="80">80%</option>
                        <option value="100">100%</option>
                    </select>

                    <label for="ubpRate">Target Improvement Rate:</label>
                    <select id="ubpRate" >
                            <option value="maintain">Maintain</option>
                            <option value="slow">Slow</option>
                            <option value="fast">Fast</option>
                    </select>
                </div>
            </fieldset>


            <!-- Aerobic Category -->
            <fieldset class="physiologicalCategory" id="aerobicCategory">
                <legend>Climbing Specific Aerobic Endurance</legend>

                    <label for="aerobicRate">Target Improvement Rate:</label>
                    <select id="aerobicRate" >
                        <option value="maintain">Maintain</option>
                        <option value="slow">Slow</option>
                        <option value="fast">Fast</option>
                    </select>
            </fieldset>


            <!-- Do you anaerobic opens a hidden section -->
            <fieldset>
                <label>
                    <input type="checkbox" id="doYouAnaerobic">
                    Include anaerobic endurance in your plan?
                </label>
            </fieldset>


            <!-- Anaerobic Category (hidden until yes)-->
            <fieldset class="physiologicalCategory" id="anaerobicCategory" style="display: none;">
                <legend>Climbing Specific Anaerobic Endurance</legend>
                <!-- Category Rate Selector -->
                <label for="anaerobicRate">Target Improvement Rate:</label>
                <select id="anaerobicRate">
                    <option value="maintain">Maintain</option>
                    <option value="slow">Slow</option>
                    <option value="fast">Fast</option>
                </select>
                <!-- Do you want to peak opens a hidden section -->
                <div id="upComingPeak">
                    <label>
                        <input type="checkbox" id="peakCheckbox">
                        Within 10 weeks of a peak?
                    </label>
                <!-- hidden section -->
                    <div id="peakTimingSection" style="display: none;">
                        <label for="weeksOutFromPeak">How many weeks until you want to peak?</label>
                        <select id="weeksOutFromPeak">
                            <option value="5">5 weeks</option>
                            <option value="10">10 weeks</option>
                        </select>
                    </div>
                </div>
            </fieldset>


            <!-- General Aerobic Fitness = GAF -->
            <fieldset>
                <legend>General Aerobic Fitness</legend>

                    <label for="gafRate">Target Improvement Rate:</label>
                    <select id="gafRate">
                            <option value="maintain">Maintain</option>
                            <option value="slow">Slow</option>
                    </select>
            </fieldset>

            <div id="actionRow">
                <button id="calculateButton" type="button">Calculate</button>
                <!-- Score -->
                <div id="scoreDisplay">Load Score: 0 / 10</div>
            </div>
        </form>
    </div>


    <div id="resultsView" class="hidden">
        <h2>Your Weekly Training Volume</h2>
        <div id="results"></div>
        <button id="backButton">Back</button>
    </div>


    <script src="script.js"></script>


</body>
</html>
